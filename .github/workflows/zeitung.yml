name: Zeitung bauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programme installieren
        run: pip install -r requirements.txt
      - name: Zeitung bauen
        run: python build_paper.py
      - name: Ergebnis speichern
        run: |
          git config user.name "morgenzeitung-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Zeitung $(date +%F)" || echo "nichts Neues"
          git push
